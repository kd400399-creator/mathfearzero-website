<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Payment Proof - MFZ Learning</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:560px;
background:#16213e;
padding:30px;
border-radius:20px;
text-align:center;
border:1px solid #263248;
}

h1{
color:#00d4ff;
margin-top:0;
}

p{
color:#cbd5e1;
line-height:24px;
}

input{
width:100%;
background:white;
color:black;
padding:12px;
border-radius:8px;
margin:18px 0;
}

.preview{
display:none;
width:100%;
max-height:280px;
object-fit:contain;
margin:18px 0;
border-radius:12px;
border:2px solid #00d4ff;
background:#0b1220;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00c8ff;
}

button:disabled{
opacity:0.6;
cursor:not-allowed;
}

#message{
margin-top:18px;
font-weight:bold;
min-height:25px;
}

.back{
display:block;
margin-top:20px;
color:#00d4ff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h1>📤 Upload Payment Proof</h1>

<p>

Select your payment screenshot.

</p>

<input
type="file"
id="paymentProof"
accept="image/*">

<img
id="imagePreview"
class="preview"
alt="Payment proof preview">

<button
type="button"
id="submitButton">

Submit Payment Proof

</button>

<p id="message"></p>

<a
class="back"
href="student.html">

← Back to Dashboard

</a>

</div>


<script>

const fileInput =

document.getElementById(
"paymentProof"
);


const imagePreview =

document.getElementById(
"imagePreview"
);


const submitButton =

document.getElementById(
"submitButton"
);


const message =

document.getElementById(
"message"
);


/* SHOW IMAGE PREVIEW */

fileInput.addEventListener(

"change",

function(){

const file =

fileInput.files[0];


if(

!file

){

imagePreview.style.display =

"none";

return;

}


imagePreview.src =

URL.createObjectURL(

file

);


imagePreview.style.display =

"block";


message.innerHTML =

"";

}

);


/* SUBMIT PAYMENT */

submitButton.addEventListener(

"click",

function(){

const file =

fileInput.files[0];


if(

!file

){

message.innerHTML =

"⚠️ Please select a payment screenshot.";

return;

}


submitButton.disabled =

true;


submitButton.innerText =

"Submitting...";


message.innerHTML =

"⏳ Submitting payment request...";


const currentUserText =

localStorage.getItem(

"mfzCurrentUser"

);


let username =

"Student";


if(

currentUserText

){

try{

const currentUser =

JSON.parse(

currentUserText

);


username =

currentUser.username ||

"Student";

}

catch(

error

){

console.log(

error

);

}

}


/* REMOVE OLD TEST REQUESTS */

localStorage.removeItem(

"mfzPaymentRequests"

);


/* SAVE ONLY SMALL REQUEST DATA */

const paymentRequest =

{

id:

Date.now(),

username:

username,

batch:

localStorage.getItem(

"mfzSelectedBatch"

)

||

"Class 6 Batch",

status:

"pending",

submittedAt:

new Date()

.toLocaleString()

};


try{

localStorage.setItem(

"mfzPaymentRequests",

JSON.stringify(

[

paymentRequest

]

)

);

}

catch(

error

){

console.log(

error

);

}


/* SUCCESS */

message.innerHTML =

"✅ Payment request submitted successfully!";


submitButton.innerText =

"Submitted ✓";


setTimeout(

function(){

window.location.href =

"student.html";

},

1500

);

}

);

</script>

</body>

</html>
