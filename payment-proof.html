<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Payment Proof - MFZ Learning</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:560px;
background:#16213e;
padding:30px;
border-radius:20px;
text-align:center;
border:1px solid #263248;
}

h1{
color:#00d4ff;
margin-top:0;
}

p{
color:#cbd5e1;
line-height:24px;
}

.batch-box{
background:#0f1b33;
padding:14px;
border-radius:10px;
margin:18px 0;
color:#dbeafe;
}

input{
width:100%;
background:white;
color:black;
padding:12px;
border-radius:8px;
margin:18px 0;
}

.preview{
display:none;
width:100%;
max-height:280px;
object-fit:contain;
margin:18px 0;
border-radius:12px;
border:2px solid #00d4ff;
background:#0b1220;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00c8ff;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#message{
margin-top:18px;
font-weight:bold;
min-height:25px;
}

.back{
display:block;
margin-top:20px;
color:#00d4ff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h1>📤 Upload Payment Proof</h1>

<p>Select your payment screenshot.</p>

<div class="batch-box">

Selected Batch:

<strong id="batchName">

Class 6 Batch

</strong>

</div>

<input
type="file"
id="paymentProof"
accept="image/jpeg,image/png,image/webp">

<img
id="imagePreview"
class="preview"
alt="Payment proof preview">

<button
type="button"
id="submitButton">

Submit Payment Proof

</button>

<p id="message"></p>

<a
class="back"
href="student.html">

← Back to Dashboard

</a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE DETAILS */

const SUPABASE_URL =
"https://vhakvwxsysaohsgbnfun.supabase.co";

const SUPABASE_KEY =
"sb_publishable_vDIEuHqMPtpQGbZazghd-A_b6yQ7BMc";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* USER */

const currentUserText =
localStorage.getItem(
"mfzCurrentUser"
);

const currentUser =
currentUserText
?
JSON.parse(
currentUserText
)
:
null;

const selectedBatch =
localStorage.getItem(
"mfzSelectedBatch"
)
||
"Class 6 Batch";


/* ELEMENTS */

const batchName =
document.getElementById(
"batchName"
);

const fileInput =
document.getElementById(
"paymentProof"
);

const imagePreview =
document.getElementById(
"imagePreview"
);

const submitButton =
document.getElementById(
"submitButton"
);

const message =
document.getElementById(
"message"
);


batchName.innerText =
selectedBatch;


/* LOGIN CHECK */

if(
!currentUser ||
currentUser.role !== "student"
){

message.innerHTML =
"❌ Please login as a student.";

submitButton.disabled =
true;

}


/* IMAGE PREVIEW */

fileInput.addEventListener(
"change",
function(){

const file =
fileInput.files[0];

if(
!file
){

imagePreview.style.display =
"none";

return;

}

if(
file.size >
50 * 1024 * 1024
){

message.innerHTML =
"❌ Image must be 50 MB or smaller.";

fileInput.value =
"";

imagePreview.style.display =
"none";

return;

}

imagePreview.src =
URL.createObjectURL(
file
);

imagePreview.style.display =
"block";

message.innerHTML =
"";

}
);


/* SUBMIT PAYMENT */

submitButton.addEventListener(
"click",
async function(){

const file =
fileInput.files[0];

if(
!file
){

message.innerHTML =
"⚠️ Please select a payment screenshot.";

return;

}

if(
!currentUser
){

message.innerHTML =
"❌ Login session not found.";

return;

}


submitButton.disabled =
true;

submitButton.innerText =
"Uploading...";

message.innerHTML =
"⏳ Uploading screenshot...";


const safeUsername =
String(
currentUser.username
)
.replace(
/[^a-zA-Z0-9_-]/g,
"_"
);


const safeFileName =
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const filePath =
safeUsername +
"/" +
Date.now() +
"-" +
safeFileName;


/* UPLOAD TO STORAGE */

const {
data: uploadData,
error: uploadError
}
=
await supabaseClient
.storage
.from(
"payment-proofs"
)
.upload(
filePath,
file,
{
contentType:
file.type,
upsert:
false
}
);


if(
uploadError
){

console.log(
uploadError
);

message.innerHTML =
"❌ Upload failed: " +
uploadError.message;

submitButton.disabled =
false;

submitButton.innerText =
"Submit Payment Proof";

return;

}


/* GET PUBLIC LINK */

const {
data: publicData
}
=
supabaseClient
.storage
.from(
"payment-proofs"
)
.getPublicUrl(
filePath
);


const proofURL =
publicData.publicUrl;


/* SAVE TO DATABASE */

message.innerHTML =
"⏳ Saving payment request...";


const {
data: databaseData,
error: databaseError
}
=
await supabaseClient
.from(
"payment_requests"
)
.insert(
[
{
username:
currentUser.username,

batch:
selectedBatch,

proof_url:
proofURL,

file_name:
file.name,

status:
"pending"
}
]
)
.select();


if(
databaseError
){

console.log(
databaseError
);

message.innerHTML =
"❌ Database error: " +
databaseError.message;

submitButton.disabled =
false;

submitButton.innerText =
"Submit Payment Proof";

return;

}


/* SUCCESS */

console.log(
databaseData
);

message.innerHTML =
"✅ Payment proof submitted successfully!";

submitButton.innerText =
"Submitted ✓";


setTimeout(
function(){

window.location.href =
"student.html";

},
1500
);

}
);

</script>

</body>

</html>
