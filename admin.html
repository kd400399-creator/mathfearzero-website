<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MFZ Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 7%;
background:#111827;
border-bottom:1px solid #263248;
}

.logo{
font-size:27px;
font-weight:bold;
color:#00d4ff;
}

.admin-area{
display:flex;
align-items:center;
gap:15px;
}

.admin-name{
font-weight:bold;
color:#dbeafe;
}

.logout{
border:none;
background:#ff9800;
color:white;
padding:10px 18px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.logout:hover{
background:#00c8ff;
}

.container{
width:90%;
max-width:1150px;
margin:40px auto;
}

.welcome{
background:#16213e;
padding:28px;
border-radius:20px;
margin-bottom:25px;
}

.welcome h1{
color:#00d4ff;
margin-bottom:10px;
}

.welcome p{
color:#cbd5e1;
line-height:24px;
}

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:30px;
}

.stat-card{
background:#16213e;
padding:23px;
border-radius:17px;
}

.stat-card h3{
color:#cbd5e1;
font-size:16px;
margin-bottom:10px;
}

.number{
font-size:32px;
font-weight:bold;
color:#ff9800;
}

.section-title{
font-size:25px;
margin:30px 0 15px;
}

.request-box{
background:#16213e;
padding:25px;
border-radius:18px;
margin-bottom:15px;
}

.request-box h3{
color:#00d4ff;
margin-bottom:10px;
}

.request-box p{
color:#cbd5e1;
margin:7px 0;
}

.pending{
display:inline-block;
padding:7px 12px;
border-radius:20px;
background:#4b3511;
color:#ffd166;
font-weight:bold;
}

.buttons{
display:flex;
gap:10px;
margin-top:18px;
flex-wrap:wrap;
}

.approve,
.reject,
.view{
border:none;
padding:11px 17px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.approve{
background:#19a463;
color:white;
}

.reject{
background:#dc3545;
color:white;
}

.view{
background:#00a9d6;
color:white;
}

.empty{
background:#16213e;
padding:30px;
border-radius:17px;
text-align:center;
color:#cbd5e1;
}

@media(max-width:600px){

nav{
padding:15px 5%;
}

.admin-name{
display:none;
}

.container{
width:92%;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">

MFZ Admin

</div>

<div class="admin-area">

<span class="admin-name">

Admin

</span>

<button
class="logout"
onclick="logoutAdmin()">

Logout

</button>

</div>

</nav>


<main class="container">

<section class="welcome">

<h1>

Admin Dashboard 👨‍💻

</h1>

<p>

Manage teacher requests,
payment requests and student
batch access from one place.

</p>

</section>


<section class="stats">

<div class="stat-card">

<h3>

Pending Teacher Requests

</h3>

<div
class="number"
id="teacherCount">

0

</div>

</div>


<div class="stat-card">

<h3>

Pending Payment Requests

</h3>

<div
class="number"
id="paymentCount">

0

</div>

</div>


<div class="stat-card">

<h3>

Total Students

</h3>

<div
class="number"
id="studentCount">

0

</div>

</div>

</section>


<h2 class="section-title">

👨‍🏫 Teacher Requests

</h2>

<div id="teacherRequests"></div>


<h2 class="section-title">

💳 Payment Requests

</h2>

<div id="paymentRequests"></div>

</main>


<script>

let users =

JSON.parse(

localStorage.getItem(
"mfzUsers"
)

) || [];


const teacherArea =

document.getElementById(
"teacherRequests"
);


const paymentArea =

document.getElementById(
"paymentRequests"
);


function loadDashboard(){

users =

JSON.parse(

localStorage.getItem(
"mfzUsers"
)

) || [];


const pendingTeachers =

users.filter(

user =>

user.role === "teacher" &&

user.approved === false

);


const students =

users.filter(

user =>

user.role === "student"

);


document.getElementById(
"teacherCount"
).innerText =

pendingTeachers.length;


document.getElementById(
"studentCount"
).innerText =

students.length;


if(

pendingTeachers.length === 0

){

teacherArea.innerHTML =

`

<div class="empty">

No pending teacher requests.

</div>

`;

}else{

teacherArea.innerHTML =

"";


pendingTeachers.forEach(

function(teacher){

const userIndex =

users.findIndex(

user =>

user.username ===
teacher.username &&

user.role ===
"teacher"

);


teacherArea.innerHTML +=

`

<div class="request-box">

<h3>

${teacher.username}

</h3>

<p>

Teacher account request

</p>

<span class="pending">

Pending

</span>

<div class="buttons">

<button
class="approve"
onclick="approveTeacher(${userIndex})">

✓ Approve

</button>

<button
class="reject"
onclick="rejectTeacher(${userIndex})">

✕ Reject

</button>

</div>

</div>

`;

}

);

}


const paymentRequests =

JSON.parse(

localStorage.getItem(
"mfzPaymentRequests"
)

) || [];


const pendingPayments =

paymentRequests.filter(

request =>

request.status === "pending"

);


document.getElementById(
"paymentCount"
).innerText =

pendingPayments.length;


if(

pendingPayments.length === 0

){

paymentArea.innerHTML =

`

<div class="empty">

No pending payment requests.

</div>

`;

}else{

paymentArea.innerHTML =

"";


pendingPayments.forEach(

function(request){

paymentArea.innerHTML +=

`

<div class="request-box">

<h3>

${request.username}

</h3>

<p>

Batch:
${request.batch}

</p>

<p>

Payment request received.

</p>

<span class="pending">

Pending

</span>

<div class="buttons">

<button
class="view"
onclick="viewProof(${request.id})">

View Proof

</button>

<button
class="approve"
onclick="approvePayment(${request.id})">

✓ Approve

</button>

<button
class="reject"
onclick="rejectPayment(${request.id})">

✕ Reject

</button>

</div>

</div>

`;

}

);

}

}


function approveTeacher(

userIndex

){

users[userIndex].approved =

true;


localStorage.setItem(

"mfzUsers",

JSON.stringify(users)

);


alert(

"✅ Teacher approved successfully."

);


loadDashboard();

}


function rejectTeacher(

userIndex

){

users.splice(

userIndex,

1

);


localStorage.setItem(

"mfzUsers",

JSON.stringify(users)

);


alert(

"Teacher request rejected."

);


loadDashboard();

}


function viewProof(

requestId

){

const requests =

JSON.parse(

localStorage.getItem(
"mfzPaymentRequests"
)

) || [];


const request =

requests.find(

item =>

item.id === requestId

);


if(

!request ||

!request.proof

){

alert(

"❌ Payment proof was not found."

);

return;

}


const proofWindow =

window.open(
"",
"_blank"
);


proofWindow.document.write(

`

<!DOCTYPE html>

<html>

<head>

<title>MFZ Payment Proof</title>

<style>

body{
margin:0;
padding:25px;
background:#0b1220;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#00d4ff;
}

img{
display:block;
max-width:95%;
max-height:80vh;
margin:25px auto;
border-radius:12px;
border:2px solid #00d4ff;
}

</style>

</head>

<body>

<h1>

MFZ Payment Proof

</h1>

<img
src="${request.proof}"
alt="Uploaded Payment Proof">

</body>

</html>

`

);


proofWindow.document.close();

}


function approvePayment(

requestId

){

const requests =

JSON.parse(

localStorage.getItem(
"mfzPaymentRequests"
)

) || [];


const requestIndex =

requests.findIndex(

item =>

item.id === requestId

);


if(

requestIndex === -1

){

alert(

"❌ Payment request not found."

);

return;

}


const request =

requests[requestIndex];


requests[requestIndex].status =

"approved";


localStorage.setItem(

"mfzPaymentRequests",

JSON.stringify(requests)

);


users =

JSON.parse(

localStorage.getItem(
"mfzUsers"
)

) || [];


const userIndex =

users.findIndex(

user =>

user.username ===
request.username &&

user.role ===
"student"

);


if(

userIndex === -1

){

alert(

"❌ Student account not found."

);

return;

}


if(

!Array.isArray(

users[userIndex].approvedBatches

)

){

users[userIndex].approvedBatches =

[];

}


if(

!users[userIndex].approvedBatches.includes(

request.batch

)

){

users[userIndex].approvedBatches.push(

request.batch

);

}


localStorage.setItem(

"mfzUsers",

JSON.stringify(users)

);


alert(

"✅ Payment approved! Class 6 Batch has been activated."

);


loadDashboard();

}


function rejectPayment(

requestId

){

const requests =

JSON.parse(

localStorage.getItem(
"mfzPaymentRequests"
)

) || [];


const requestIndex =

requests.findIndex(

item =>

item.id === requestId

);


if(

requestIndex === -1

){

return;

}


requests[requestIndex].status =

"rejected";


localStorage.setItem(

"mfzPaymentRequests",

JSON.stringify(requests)

);


alert(

"Payment request rejected."

);


loadDashboard();

}


function logoutAdmin(){

localStorage.removeItem(

"mfzCurrentUser"

);


window.location.href =

"login.html";

}


loadDashboard();

</script>

</body>

</html>
