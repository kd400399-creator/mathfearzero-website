<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Payment Proof - MFZ</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:500px;
background:#16213e;
padding:30px;
border-radius:20px;
text-align:center;
}

h1{
color:#00d4ff;
margin-top:0;
}

p{
color:#cbd5e1;
line-height:24px;
}

input{
width:100%;
background:white;
color:black;
padding:12px;
border-radius:8px;
margin:20px 0;
}

#preview{
display:none;
width:100%;
max-height:280px;
object-fit:contain;
background:#0b1220;
border-radius:12px;
margin-bottom:15px;
border:1px solid #263248;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00c8ff;
}

button:disabled{
background:#64748b;
cursor:not-allowed;
}

#message{
margin-top:18px;
font-weight:bold;
}

.back{
display:block;
margin-top:20px;
color:#00d4ff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h1>
📤 Upload Payment Proof
</h1>

<p>

Select your payment screenshot.
The image will be optimized
automatically.

</p>

<input
type="file"
id="paymentProof"
accept="image/*">

<img
id="preview"
alt="Payment proof preview">

<button
type="button"
id="submitButton">

Submit Payment Proof

</button>

<p id="message"></p>

<a
class="back"
href="student.html">

← Back to Dashboard

</a>

</div>

<script>

const currentUserText =

localStorage.getItem(
"mfzCurrentUser"
);


const currentUser =

currentUserText

?

JSON.parse(
currentUserText
)

:

null;


const fileInput =

document.getElementById(
"paymentProof"
);


const submitButton =

document.getElementById(
"submitButton"
);


const message =

document.getElementById(
"message"
);


const preview =

document.getElementById(
"preview"
);


let finalProof =

null;


if(

!currentUser ||

currentUser.role !==
"student"

){

message.innerHTML =

"❌ Please login as a student.";

}


fileInput.addEventListener(

"change",

function(){

const file =

fileInput.files[0];


if(

!file

){

return;

}


if(

!file.type.startsWith(
"image/"
)

){

message.innerHTML =

"❌ Please select an image.";

fileInput.value =

"";

return;

}


message.innerHTML =

"⏳ Preparing screenshot...";


const reader =

new FileReader();


reader.onload =

function(event){

const image =

new Image();


image.onload =

function(){

let width =

image.width;


let height =

image.height;


const maximum =

1000;


if(

width > maximum ||

height > maximum

){

if(

width >= height

){

height =

Math.round(

height *
maximum /
width

);


width =

maximum;

}

else{

width =

Math.round(

width *
maximum /
height

);


height =

maximum;

}

}


const canvas =

document.createElement(
"canvas"
);


canvas.width =

width;


canvas.height =

height;


const context =

canvas.getContext(
"2d"
);


context.drawImage(

image,

0,

0,

width,

height

);


finalProof =

canvas.toDataURL(

"image/jpeg",

0.65

);


preview.src =

finalProof;


preview.style.display =

"block";


message.innerHTML =

"✅ Screenshot is ready. Now press Submit.";

};


image.onerror =

function(){

message.innerHTML =

"❌ This image could not be opened.";

};


image.src =

event.target.result;

};


reader.onerror =

function(){

message.innerHTML =

"❌ File could not be read.";

};


reader.readAsDataURL(

file

);

}

);


submitButton.addEventListener(

"click",

function(){

if(

!currentUser ||

currentUser.role !==
"student"

){

message.innerHTML =

"❌ Please login again.";

return;

}


if(

!finalProof

){

message.innerHTML =

"⚠️ First select a screenshot and wait until its preview appears.";

return;

}


submitButton.disabled =

true;


submitButton.innerText =

"Submitting...";


message.innerHTML =

"⏳ Submitting payment proof...";


try{

const savedRequests =

localStorage.getItem(
"mfzPaymentRequests"
);


let requests =

savedRequests

?

JSON.parse(
savedRequests
)

:

[];


const newRequest = {

id:
Date.now(),

username:
currentUser.username,

batch:
"Class 6 Batch",

proof:
finalProof,

status:
"pending",

submittedAt:
new Date().toLocaleString()

};


requests.push(

newRequest

);


localStorage.setItem(

"mfzPaymentRequests",

JSON.stringify(
requests
)

);


message.innerHTML =

"✅ Payment proof submitted successfully!";


submitButton.innerText =

"Submitted ✓";


setTimeout(

function(){

window.location.href =

"student.html";

},

1200

);

}

catch(error){

console.log(
error
);


message.innerHTML =

"❌ Storage is full. Please delete old test payment requests.";


submitButton.disabled =

false;


submitButton.innerText =

"Submit Payment Proof";

}

}

);

</script>

</body>

</html>
