<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MFZ Payment Proof Upload</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 8%;
background:#111827;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00d4ff;
}

.back{
background:#ff9800;
color:white;
text-decoration:none;
padding:10px 18px;
border-radius:8px;
}

.box{
width:90%;
max-width:600px;
margin:55px auto;
padding:35px;
background:#16213e;
border-radius:22px;
text-align:center;
}

h1{
color:#00d4ff;
margin-bottom:15px;
}

p{
color:#d4d4d4;
line-height:25px;
margin:12px 0;
}

.upload-area{
margin-top:25px;
padding:25px;
border:2px dashed #00d4ff;
border-radius:15px;
}

input{
width:100%;
margin:15px 0;
padding:12px;
background:white;
color:black;
border-radius:8px;
}

.submit{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.submit:hover{
background:#00c8ff;
}

.message{
margin-top:18px;
font-weight:bold;
}

</style>

</head>

<body>

<nav>

<div class="logo">

MFZ

</div>

<a
class="back"
href="classes.html">

← Back

</a>

</nav>


<div class="box">

<h1>

📤 Upload Payment Proof

</h1>

<p>

Upload your payment screenshot.
Your request will be checked and
approved within 24 hours.

</p>


<div class="upload-area">

<input
type="file"
id="paymentProof"
accept="image/*">

<p>

Select your payment screenshot.

</p>

</div>


<button
class="submit"
onclick="submitProof()">

Submit Payment Proof

</button>


<p
class="message"
id="message">

</p>

</div>


<script>

const currentUser=

JSON.parse(

localStorage.getItem(
"mfzCurrentUser"
)

);


if(

!currentUser ||

currentUser.role!=="student"

){

window.location.href=
"login.html";

}


function submitProof(){

const file=

document
.getElementById(
"paymentProof"
)
.files[0];


const message=

document
.getElementById(
"message"
);


if(!file){

message.innerHTML=

"⚠️ Please select a payment screenshot.";

return;

}


const reader=

new FileReader();


reader.onload=

function(event){

const requests=

JSON.parse(

localStorage.getItem(
"mfzPaymentRequests"
)

) || [];


const alreadySubmitted=

requests.find(

request=>

request.username===
currentUser.username &&

request.batch===
"Class 6 Batch" &&

request.status===
"pending"

);


if(alreadySubmitted){

message.innerHTML=

"⏳ Your Class 6 request is already pending.";

return;

}


requests.push({

id:
Date.now(),

username:
currentUser.username,

batch:
"Class 6 Batch",

proof:
event.target.result,

status:
"pending",

submittedAt:
new Date().toLocaleString()

});


localStorage.setItem(

"mfzPaymentRequests",

JSON.stringify(requests)

);


message.innerHTML=

"✅ Payment proof submitted! Your request is pending admin approval.";


setTimeout(

function(){

window.location.href=
"student.html";

},

1500

);

};


reader.readAsDataURL(
file
);

}

</script>

</body>

</html>
