<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Payment Proof - MFZ</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:500px;
background:#16213e;
padding:30px;
border-radius:20px;
text-align:center;
}

h1{
color:#00d4ff;
margin-top:0;
}

p{
color:#cbd5e1;
line-height:24px;
}

input{
width:100%;
background:white;
color:black;
padding:12px;
border-radius:8px;
margin:20px 0;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00c8ff;
}

#message{
margin-top:18px;
font-weight:bold;
}

.back{
display:block;
margin-top:20px;
color:#00d4ff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h1>📤 Upload Payment Proof</h1>

<p>

Upload your payment proof.
Your request will be reviewed
within 24 hours.

</p>

<input
type="file"
id="paymentProof"
accept="image/*">

<button
type="button"
id="submitButton">

Submit Payment Proof

</button>

<p id="message"></p>

<a
class="back"
href="student.html">

← Back to Dashboard

</a>

</div>

<script>

const currentUserText =
localStorage.getItem(
"mfzCurrentUser"
);

const currentUser =
currentUserText
? JSON.parse(currentUserText)
: null;


if(!currentUser){

document.getElementById(
"message"
).innerHTML =
"❌ Please login again.";

}


document.getElementById(
"submitButton"
).addEventListener(

"click",

function(){

const message =
document.getElementById(
"message"
);

const fileInput =
document.getElementById(
"paymentProof"
);

const file =
fileInput.files[0];


if(!currentUser){

message.innerHTML =
"❌ Login session not found.";

return;

}


if(!file){

message.innerHTML =
"⚠️ Please select a photo first.";

return;

}


if(

file.size >
2 * 1024 * 1024

){

message.innerHTML =
"⚠️ Photo is too large. Please upload a photo below 2 MB.";

return;

}


message.innerHTML =
"⏳ Uploading payment proof...";


const reader =
new FileReader();


reader.onload =
function(event){

try{

const requestsText =
localStorage.getItem(
"mfzPaymentRequests"
);

const requests =
requestsText
? JSON.parse(requestsText)
: [];


const newRequest = {

id:
Date.now(),

username:
currentUser.username,

batch:
"Class 6 Batch",

proof:
event.target.result,

status:
"pending",

submittedAt:
new Date().toLocaleString()

};


requests.push(
newRequest
);


localStorage.setItem(

"mfzPaymentRequests",

JSON.stringify(
requests
)

);


message.innerHTML =
"✅ Payment proof submitted successfully!";


setTimeout(

function(){

window.location.href =
"student.html";

},

1500

);

}catch(error){

message.innerHTML =
"❌ Upload failed. Please use a smaller photo.";

console.log(
error
);

}

};


reader.onerror =
function(){

message.innerHTML =
"❌ This photo could not be read. Please choose another photo.";

};


reader.readAsDataURL(
file
);

}

);

</script>

</body>

</html>
