<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Upload Payment Proof - MFZ
</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:520px;
background:#16213e;
padding:30px;
border-radius:20px;
text-align:center;
}

h1{
color:#00d4ff;
margin-top:0;
}

p{
color:#cbd5e1;
line-height:24px;
}

input{
width:100%;
background:white;
color:black;
padding:12px;
border-radius:8px;
margin:20px 0;
}

.preview-box{
display:none;
margin:10px 0 20px;
padding:12px;
background:#0b1220;
border-radius:12px;
border:1px solid #263248;
}

.preview-box img{
width:100%;
max-height:280px;
object-fit:contain;
border-radius:9px;
}

.file-info{
color:#cbd5e1;
font-size:14px;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00c8ff;
}

button:disabled{
background:#596273;
cursor:not-allowed;
}

#message{
margin-top:18px;
font-weight:bold;
}

.back{
display:block;
margin-top:20px;
color:#00d4ff;
text-decoration:none;
}

.note{
font-size:13px;
color:#94a3b8;
margin-top:15px;
}

</style>

</head>

<body>

<div class="box">

<h1>
📤 Upload Payment Proof
</h1>

<p>

Select your payment screenshot.
The website will automatically
optimize the image before saving.

</p>

<input
type="file"
id="paymentProof"
accept="image/jpeg,image/png,image/webp">

<div
class="preview-box"
id="previewBox">

<img
id="previewImage"
alt="Payment proof preview">

<p
class="file-info"
id="fileInfo">

</p>

</div>

<button
type="button"
id="submitButton">

Submit Payment Proof

</button>

<p id="message"></p>

<p class="note">

For very large files,
cloud storage will be added
later. Normal payment screenshots
should work here.

</p>

<a
class="back"
href="student.html">

← Back to Dashboard

</a>

</div>

<script>

const currentUserText =

localStorage.getItem(
"mfzCurrentUser"
);


const currentUser =

currentUserText

?

JSON.parse(
currentUserText
)

:

null;


const fileInput =

document.getElementById(
"paymentProof"
);


const submitButton =

document.getElementById(
"submitButton"
);


const message =

document.getElementById(
"message"
);


const previewBox =

document.getElementById(
"previewBox"
);


const previewImage =

document.getElementById(
"previewImage"
);


const fileInfo =

document.getElementById(
"fileInfo"
);


let compressedProof =

null;


if(

!currentUser ||

currentUser.role !==
"student"

){

message.innerHTML =

"❌ Please login as a student.";

submitButton.disabled =

true;

}


fileInput.addEventListener(

"change",

function(){

const file =

fileInput.files[0];


compressedProof =

null;


previewBox.style.display =

"none";


if(

!file

){

return;

}


if(

!file.type.startsWith(
"image/"
)

){

message.innerHTML =

"❌ Please select an image file.";

fileInput.value =

"";

return;

}


message.innerHTML =

"⏳ Preparing your screenshot...";


submitButton.disabled =

true;


compressImage(

file,

function(result){

compressedProof =

result;


previewImage.src =

result;


previewBox.style.display =

"block";


const sizeKB =

Math.round(

result.length *
0.75 /
1024

);


fileInfo.innerHTML =

"✓ Optimized image: about " +

sizeKB +

" KB";


message.innerHTML =

"✅ Screenshot is ready.";

submitButton.disabled =

false;

}

);

}

);


function compressImage(

file,

callback

){

const reader =

new FileReader();


reader.onload =

function(event){

const image =

new Image();


image.onload =

function(){

let width =

image.width;


let height =

image.height;


const maxWidth =

1200;


const maxHeight =

1200;


if(

width > maxWidth

){

height =

Math.round(

height *
maxWidth /
width

);


width =

maxWidth;

}


if(

height > maxHeight

){

width =

Math.round(

width *
maxHeight /
height

);


height =

maxHeight;

}


const canvas =

document.createElement(
"canvas"
);


canvas.width =

width;


canvas.height =

height;


const context =

canvas.getContext(
"2d"
);


context.drawImage(

image,

0,

0,

width,

height

);


let quality =

0.72;


let result =

canvas.toDataURL(

"image/jpeg",

quality

);


while(

result.length >

900000 &&

quality >

0.30

){

quality =

quality -
0.08;


result =

canvas.toDataURL(

"image/jpeg",

quality

);

}


callback(

result

);

};


image.onerror =

function(){

message.innerHTML =

"❌ This image could not be opened.";

submitButton.disabled =

false;

};


image.src =

event.target.result;

};


reader.readAsDataURL(

file

);

}


submitButton.addEventListener(

"click",

function(){

if(

!currentUser

){

message.innerHTML =

"❌ Login session not found.";

return;

}


if(

!compressedProof

){

message.innerHTML =

"⚠️ Please select a screenshot first.";

return;

}


submitButton.disabled =

true;


submitButton.innerText =

"Submitting...";


message.innerHTML =

"⏳ Saving payment request...";


try{

const requestsText =

localStorage.getItem(
"mfzPaymentRequests"
);


let requests =

requestsText

?

JSON.parse(
requestsText
)

:

[];


requests =

requests.filter(

request =>

!(

request.username ===
currentUser.username &&

request.batch ===
"Class 6 Batch" &&

request.status ===
"pending"

)

);


const newRequest = {

id:
Date.now(),

username:
currentUser.username,

batch:
"Class 6 Batch",

proof:
compressedProof,

status:
"pending",

submittedAt:
new Date().toLocaleString()

};


requests.push(

newRequest

);


localStorage.setItem(

"mfzPaymentRequests",

JSON.stringify(
requests
)

);


message.innerHTML =

"✅ Payment proof submitted successfully!";


submitButton.innerText =

"Submitted ✓";


setTimeout(

function(){

window.location.href =

"student.html";

},

1500

);

}

catch(error){

console.log(
error
);


message.innerHTML =

"❌ Browser storage is full. Please clear old test requests and try again.";


submitButton.disabled =

false;


submitButton.innerText =

"Submit Payment Proof";

}

}

);

</script>

</body>

</html>
