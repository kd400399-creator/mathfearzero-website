<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MFZ Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
padding:20px;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 8%;
background:#111827;
border-radius:15px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00d4ff;
}

.back{
background:#ff9800;
color:white;
text-decoration:none;
padding:10px 18px;
border-radius:8px;
}

.login-page{
max-width:850px;
margin:55px auto;
text-align:center;
}

.login-page h1{
color:#00d4ff;
font-size:38px;
margin-bottom:12px;
}

.subtitle{
color:#cbd5e1;
margin-bottom:35px;
font-size:18px;
}

.role-cards{
display:flex;
gap:25px;
justify-content:center;
flex-wrap:wrap;
}

.role-card{
width:350px;
background:#16213e;
padding:35px 25px;
border-radius:22px;
cursor:pointer;
transition:.25s;
border:2px solid transparent;
}

.role-card:hover{
transform:translateY(-6px);
border-color:#00d4ff;
}

.role-icon{
font-size:55px;
margin-bottom:15px;
}

.role-card h2{
color:#00d4ff;
margin-bottom:12px;
}

.role-card p{
color:#cbd5e1;
line-height:24px;
}

.login-box{
display:none;
width:100%;
max-width:430px;
margin:40px auto;
background:#16213e;
padding:35px;
border-radius:22px;
text-align:left;
}

.login-box h2{
text-align:center;
color:#00d4ff;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:9px 0;
border:none;
border-radius:9px;
font-size:16px;
}

.main-button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.main-button:hover{
background:#00c8ff;
}

.small-button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:9px;
background:#0b1220;
color:white;
font-size:15px;
cursor:pointer;
}

.message{
margin-top:15px;
text-align:center;
line-height:22px;
color:white;
}

</style>

</head>

<body>

<nav>

<div class="logo">
MFZ Learning
</div>

<a class="back" href="index.html">
← Back
</a>

</nav>

<section class="login-page" id="rolePage">

<h1>Welcome to MFZ Learning</h1>

<p class="subtitle">
Choose your login type
</p>

<div class="role-cards">

<div class="role-card" onclick="openLogin('student')">

<div class="role-icon">
🎓
</div>

<h2>Student Login</h2>

<p>
Login to access your courses, batches and learning dashboard.
</p>

</div>

<div class="role-card" onclick="openLogin('teacher')">

<div class="role-icon">
👨‍🏫
</div>

<h2>Teacher Login</h2>

<p>
Login to manage classes, students and your teacher dashboard.
</p>

</div>

</div>

</section>

<div class="login-box" id="loginBox">

<h2 id="loginTitle">
Login
</h2>

<input
type="email"
id="email"
placeholder="Enter your email"

>

<input
type="password"
id="password"
placeholder="Enter your password"

>

<button class="main-button" onclick="loginUser()">

Login

</button>

<button class="small-button" onclick="createAccount()">

Create New Account

</button>

<button class="small-button" onclick="goBack()">

← Choose Another Login

</button>

<p class="message" id="message"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendEmailVerification
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyC5A7xCZjLgVEIz1SOE9oju2dpui76xAig",

authDomain: "mfz-learning.firebaseapp.com",

projectId: "mfz-learning",

storageBucket: "mfz-learning.firebasestorage.app",

messagingSenderId: "793150284094",

appId: "1:793150284094:web:17ebcdc2bab15141c28c6f"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

let selectedRole = "";


window.openLogin = function(role){

selectedRole = role;

document.getElementById("rolePage").style.display="none";

document.getElementById("loginBox").style.display="block";

document.getElementById("loginTitle").innerHTML=

role === "student"

? "🎓 Student Login"

: "👨‍🏫 Teacher Login";

};


window.goBack = function(){

document.getElementById("loginBox").style.display="none";

document.getElementById("rolePage").style.display="block";

document.getElementById("message").innerHTML="";

};


window.createAccount = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

if(email === "" || password === ""){

message.innerHTML=
"⚠️ Please enter email and password.";

return;

}

if(selectedRole === "teacher"){

message.innerHTML=
"⚠️ Teacher accounts are created only after admin approval.";

return;

}

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await sendEmailVerification(
userCredential.user
);

message.innerHTML=
"✅ Student account created! Check your email and verify it before logging in.";

}catch(error){

message.innerHTML=
"❌ " + error.message;

}

};


window.loginUser = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

if(email === "" || password === ""){

message.innerHTML=
"⚠️ Please enter email and password.";

return;

}

try{

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

if(!userCredential.user.emailVerified){

message.innerHTML=
"⚠️ Please verify your email first.";

return;

}

localStorage.setItem(
"mfzUser",
userCredential.user.email
);

localStorage.setItem(
"mfzRole",
selectedRole
);

message.innerHTML=
"✅ Login successful!";

setTimeout(function(){

if(selectedRole === "student"){

window.location.href=
"student.html";

}else{

window.location.href=
"teacher.html";

}

},700);

}catch(error){

message.innerHTML=
"❌ Email or password is incorrect.";

}

};

</script>

</body>

</html>
