<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MFZ Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:#16213e;
padding:35px;
border-radius:22px;
box-shadow:0 15px 40px rgba(0,0,0,.35);
}

h1{
text-align:center;
color:#00d4ff;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:25px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tabs button{
width:50%;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
background:#0b1220;
color:white;
}

.tabs button.active{
background:#ff9800;
}

input{
width:100%;
padding:14px;
margin:9px 0;
border:none;
border-radius:9px;
font-size:16px;
}

.main-button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.main-button:hover{
background:#00c8ff;
}

.message{
margin-top:15px;
text-align:center;
line-height:22px;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#00d4ff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<h1>MFZ Learning</h1>

<p class="subtitle">
Login or create your student account
</p>

<div class="tabs">

<button id="loginTab" class="active" onclick="showLogin()">
Login
</button>

<button id="signupTab" onclick="showSignup()">
Create Account
</button>

</div>

<div id="loginForm">

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
required

>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required

>

<button class="main-button" onclick="loginUser()">

Login

</button>

</div>

<div id="signupForm" style="display:none;">

<input
type="email"
id="signupEmail"
placeholder="Enter your email"
required

>

<input
type="password"
id="signupPassword"
placeholder="Create password (minimum 6 characters)"
required

>

<button class="main-button" onclick="signupUser()">

Create Student Account

</button>

</div>

<p class="message" id="message"></p>

<a class="back" href="index.html">

← Back to Home

</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendEmailVerification
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyC5A7xCZjLgVEIz1SOE9oju2dpui76xAig",

authDomain: "mfz-learning.firebaseapp.com",

projectId: "mfz-learning",

storageBucket: "mfz-learning.firebasestorage.app",

messagingSenderId: "793150284094",

appId: "1:793150284094:web:17ebcdc2bab15141c28c6f"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.showLogin = function(){

document.getElementById("loginForm").style.display="block";

document.getElementById("signupForm").style.display="none";

document.getElementById("loginTab").classList.add("active");

document.getElementById("signupTab").classList.remove("active");

document.getElementById("message").innerHTML="";

};


window.showSignup = function(){

document.getElementById("loginForm").style.display="none";

document.getElementById("signupForm").style.display="block";

document.getElementById("signupTab").classList.add("active");

document.getElementById("loginTab").classList.remove("active");

document.getElementById("message").innerHTML="";

};


window.signupUser = async function(){

const email =
document.getElementById("signupEmail").value.trim();

const password =
document.getElementById("signupPassword").value;

const message =
document.getElementById("message");

if(email === "" || password === ""){

message.innerHTML=
"Please enter email and password.";

return;

}

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await sendEmailVerification(
userCredential.user
);

message.innerHTML=
"✅ Account created! A verification email has been sent. Please verify your email, then login.";

}catch(error){

message.innerHTML=
"❌ " + error.message;

}

};


window.loginUser = async function(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const message =
document.getElementById("message");

if(email === "" || password === ""){

message.innerHTML=
"Please enter email and password.";

return;

}

try{

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

if(!userCredential.user.emailVerified){

message.innerHTML=
"⚠️ Please verify your email first.";

return;

}

localStorage.setItem(
"mfzUser",
userCredential.user.email
);

message.innerHTML=
"✅ Login successful!";

setTimeout(function(){

window.location.href=
"student.html";

},800);

}catch(error){

message.innerHTML=
"❌ Email or password is incorrect.";

}

};

</script>

</body>

</html>
