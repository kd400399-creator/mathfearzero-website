<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MFZ Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:450px;
background:#16213e;
padding:35px;
border-radius:22px;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

h1{
text-align:center;
color:#00d4ff;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:25px;
}

.role-box{
display:flex;
gap:12px;
margin-bottom:22px;
}

.role{
width:50%;
padding:16px;
border:none;
border-radius:10px;
background:#0b1220;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.role.active{
background:#ff9800;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:18px;
}

.tabs button{
width:50%;
padding:12px;
border:none;
border-radius:8px;
background:#0b1220;
color:white;
font-weight:bold;
cursor:pointer;
}

.tabs button.active{
background:#00d4ff;
color:#07111f;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:9px;
margin:8px 0;
font-size:16px;
}

.main-btn{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:9px;
background:#ff9800;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.main-btn:hover{
background:#00c8ff;
}

.message{
text-align:center;
margin-top:15px;
line-height:22px;
color:#ffffff;
}

.back{
display:block;
text-align:center;
color:#00d4ff;
text-decoration:none;
margin-top:20px;
}

</style>

</head>

<body>

<div class="box">

<h1>MFZ Learning</h1>

<p class="subtitle">

Learn • Practice • Grow

</p>


<div class="role-box">

<button
class="role active"
id="studentRole"
onclick="selectRole('student')">

🎓 Student

</button>

<button
class="role"
id="teacherRole"
onclick="selectRole('teacher')">

👨‍🏫 Teacher

</button>

</div>


<div class="tabs">

<button
class="active"
id="loginTab"
onclick="showLogin()">

Login

</button>

<button
id="createTab"
onclick="showCreate()">

Create Account

</button>

</div>


<div id="loginForm">

<input
id="loginUsername"
type="text"
placeholder="Enter username">

<input
id="loginPassword"
type="password"
placeholder="Enter password">

<button
class="main-btn"
onclick="loginUser()">

Login

</button>

</div>


<div
id="createForm"
style="display:none;">

<input
id="createUsername"
type="text"
placeholder="Create username">

<input
id="createPassword"
type="password"
placeholder="Create password">

<input
id="confirmPassword"
type="password"
placeholder="Confirm password">

<button
class="main-btn"
onclick="createUser()">

Create Account

</button>

</div>


<p
class="message"
id="message">

</p>


<a
class="back"
href="index.html">

← Back to Home

</a>

</div>


<script>

let selectedRole="student";


function selectRole(role){

selectedRole=role;

document
.getElementById("studentRole")
.classList.remove("active");

document
.getElementById("teacherRole")
.classList.remove("active");


if(role==="student"){

document
.getElementById("studentRole")
.classList.add("active");

}else{

document
.getElementById("teacherRole")
.classList.add("active");

}

document
.getElementById("message")
.innerHTML="";

}


function showLogin(){

document
.getElementById("loginForm")
.style.display="block";

document
.getElementById("createForm")
.style.display="none";


document
.getElementById("loginTab")
.classList.add("active");

document
.getElementById("createTab")
.classList.remove("active");

}


function showCreate(){

document
.getElementById("loginForm")
.style.display="none";

document
.getElementById("createForm")
.style.display="block";


document
.getElementById("createTab")
.classList.add("active");

document
.getElementById("loginTab")
.classList.remove("active");

}


function createUser(){

let username=

document
.getElementById("createUsername")
.value
.trim();


let password=

document
.getElementById("createPassword")
.value;


let confirmPassword=

document
.getElementById("confirmPassword")
.value;


let message=

document
.getElementById("message");


if(
username==="" ||
password==="" ||
confirmPassword===""
){

message.innerHTML=

"⚠️ Please fill all details.";

return;

}


if(password!==confirmPassword){

message.innerHTML=

"❌ Passwords do not match.";

return;

}


if(password.length<6){

message.innerHTML=

"⚠️ Password must have at least 6 characters.";

return;

}


let users=

JSON.parse(

localStorage.getItem("mfzUsers")

) || [];


let exists=

users.find(

user=>

user.username===username

);


if(exists){

message.innerHTML=

"❌ Username already exists.";

return;

}


users.push({

username:username,

password:password,

role:selectedRole,

approved:

selectedRole==="student"

});


localStorage.setItem(

"mfzUsers",

JSON.stringify(users)

);


if(selectedRole==="teacher"){

message.innerHTML=

"✅ Teacher request sent! Please wait for admin approval.";

}else{

message.innerHTML=

"✅ Student account created! Now login.";

}


showLogin();

}


function loginUser(){

let username=

document
.getElementById("loginUsername")
.value
.trim();


let password=

document
.getElementById("loginPassword")
.value;


let message=

document
.getElementById("message");


let users=

JSON.parse(

localStorage.getItem("mfzUsers")

) || [];


let user=

users.find(

item=>

item.username===username &&

item.password===password &&

item.role===selectedRole

);


if(!user){

message.innerHTML=

"❌ Username or password is incorrect.";

return;

}


if(

selectedRole==="teacher" &&

user.approved===false

){

message.innerHTML=

"⏳ Your teacher request is pending admin approval.";

return;

}


localStorage.setItem(

"mfzCurrentUser",

JSON.stringify(user)

);


message.innerHTML=

"✅ Login successful!";


setTimeout(

function(){

if(selectedRole==="student"){

window.location.href=

"student.html";

}else{

window.location.href=

"teacher.html";

}

},

700

);

}

</script>

</body>

</html>
