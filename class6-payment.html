<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MFZ Payment</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 8%;
background:#111827;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00d4ff;
}

.back{
background:#ff9800;
color:white;
text-decoration:none;
padding:10px 18px;
border-radius:8px;
font-weight:bold;
}

.payment-box{
max-width:600px;
margin:55px auto;
padding:35px;
background:#16213e;
border-radius:22px;
text-align:center;
border:1px solid #263248;
}

.payment-box h1{
color:#00d4ff;
font-size:32px;
margin-bottom:15px;
}

.payment-box p{
color:#d4d4d4;
line-height:26px;
margin:12px 0;
}

.batch-name{
color:#00d4ff;
font-weight:bold;
}

.price{
font-size:32px;
font-weight:bold;
color:#ff9800;
margin:22px 0;
}

.qr-box{
background:white;
display:inline-block;
padding:15px;
border-radius:15px;
margin:20px 0;
}

.qr-box img{
width:260px;
max-width:100%;
display:block;
}

.next{
background:#ff9800;
color:white;
border:none;
padding:15px 35px;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.next:hover{
background:#00c8ff;
}

.note{
margin-top:20px;
font-size:14px;
color:#bfc7d5;
}

</style>

</head>

<body>

<nav>

<div class="logo">

MFZ Learning

</div>

<a
class="back"
href="classes.html">

← Back

</a>

</nav>


<section class="payment-box">

<h1>

💳 Batch Payment

</h1>

<p>

Selected Batch:

</p>

<p
class="batch-name"
id="batchName">

Class 6 Batch

</p>

<div class="price">

₹99 / Year

</div>

<p>

नीचे दिए गए QR Code को scan करके
₹99 का payment करें।

</p>

<div class="qr-box">

<img
src="payment-qr.jpg"
alt="MFZ Payment QR">

</div>

<p>

Payment पूरा होने के बाद
नीचे Next दबाएँ।

</p>

<button
class="next"
onclick="goToGoogleForm()">

Next →

</button>

<p class="note">

Next दबाने पर payment details वाला
Google Form खुलेगा। वहाँ अपनी details
और payment screenshot submit करें।

</p>

</section>


<script>

const selectedBatch =

localStorage.getItem(

"mfzSelectedBatch"

)

||

"Class 6 Batch";


document.getElementById(

"batchName"

).innerText =

selectedBatch;


function goToGoogleForm(){

window.location.href =

"https://docs.google.com/forms/d/e/1FAIpQLSfSt17dN6lBLgBdQBXeCUk7BRhW7mBq17RHoVtmd0-6Rz1wNA/viewform?usp=sharing&ouid=105251290973785415662";

}

</script>

</body>

</html>
